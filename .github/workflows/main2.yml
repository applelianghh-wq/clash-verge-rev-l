name: Build Windows App

on:
workflow_dispatch:

jobs:
build:
runs-on: windows-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Install pnpm
    run: npm install -g pnpm

  - name: Setup Rust
    uses: dtolnay/rust-toolchain@stable

  - name: Install dependencies
    run: pnpm install

  - name: Build
    run: pnpm tauri build
```
